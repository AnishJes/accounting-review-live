<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host · Accounting Review Live</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100vh; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 32px 40px; min-height: 100vh; display: flex; flex-direction: column; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  header.top .brand { font-size: 26px; }
  .pill { background: rgba(255,255,255,.14); padding: 8px 14px; border-radius: 999px; font-weight: 800; font-size: 16px; }

  /* setup */
  #setup { max-width: 560px; margin: 6vh auto 0; }
  #setup h1 { margin: 0 0 6px; font-size: 30px; }
  #setup p { color: var(--muted); margin: 0 0 20px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .row label.lbl { font-weight: 800; width: 120px; }
  .chip { display: inline-flex; gap: 8px; align-items: center; border: 2px solid var(--line); padding: 8px 12px; border-radius: 999px; font-weight: 700; }
  select, input[type=password] { font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 2px solid var(--line); }

  /* lobby */
  .lobby-head { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; background: #fff; color: var(--ink); border-radius: var(--radius); padding: 22px 28px; }
  .joinat { font-size: 22px; font-weight: 700; color: var(--muted); }
  .joinat b { color: var(--ink); }
  .pinlabel { font-size: 20px; font-weight: 800; color: var(--muted); margin-top: 10px; }
  .bigpin { font-size: 96px; font-weight: 900; letter-spacing: .06em; line-height: 1; }
  .qr { width: 200px; height: 200px; }
  .lobby-bar { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 14px; }
  .count { font-size: 28px; font-weight: 900; }
  .names { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
  .name { background: rgba(255,255,255,.95); color: var(--ink); font-weight: 800; padding: 8px 14px; border-radius: 8px; border: 0; font-size: 17px; animation: pop .25s ease-out; }
  .name:hover { background: #ffd9df; text-decoration: line-through; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }

  /* question */
  .qmeta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .qbox { background: #fff; color: var(--ink); border-radius: var(--radius); padding: 22px 28px; margin: 14px 0; }
  .qtext { font-size: clamp(20px, 2.1vw, 30px); font-weight: 800; line-height: 1.3; margin: 0; }
  .qbox .tablewrap { margin-top: 14px; max-height: 38vh; overflow: auto; }
  .qbox table.data { font-size: clamp(14px, 1.2vw, 18px); }
  .mid { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; gap: 16px; }
  .timer { width: 96px; height: 96px; border-radius: 50%; background: var(--accent); color: var(--ink); display: grid; place-items: center; font-size: 38px; font-weight: 900; }
  .timer.low { background: var(--bad); color: #fff; }
  .answered { text-align: center; } .answered b { display: block; font-size: 44px; font-weight: 900; } .answered span { font-weight: 700; opacity: .85; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tiles .tile { font-size: clamp(16px, 1.5vw, 22px); min-height: 78px; position: relative; }
  .tiles .tile .cnt { margin-left: auto; font-size: 26px; font-weight: 900; padding-left: 12px; }
  .ms-note { font-weight: 800; color: var(--accent); }
  .controls { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; position: sticky; bottom: 12px; }

  /* side-by-side layout for questions with a data table */
  #question.withdata .qgrid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: start; }
  #question.withdata .qtext { font-size: clamp(18px, 1.6vw, 26px); }
  #question.withdata .qbox .tablewrap { max-height: none; }
  #question.withdata .qbox table.data { font-size: clamp(13px, 1.05vw, 17px); }
  #question.withdata table.data td, #question.withdata table.data th { padding: 4px 8px; }
  #question.withdata .tiles { grid-template-columns: 1fr; gap: 8px; }
  #question.withdata .tiles .tile { min-height: 54px; padding: 10px 14px; }
  #question.withdata .mid { margin-top: 14px; }
  #question.withdata .bars { height: 120px; gap: 14px; }
  #question.withdata .bar { width: 64px; }
  #question.withdata .explain { font-size: 16px; }
  @media (max-width: 900px) { #question.withdata .qgrid { grid-template-columns: 1fr; } }

  /* reveal */
  .bars { display: flex; align-items: flex-end; justify-content: center; gap: 22px; height: 160px; margin: 6px 0 14px; }
  .bar { width: 90px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .bar .fill { width: 100%; border-radius: 8px 8px 0 0; min-height: 6px; transition: height .6s ease-out; }
  .bar .n { font-weight: 900; font-size: 22px; margin-bottom: 4px; }
  .bar .tick { font-weight: 900; margin-top: 6px; height: 24px; }
  .explain { background: rgba(255,255,255,.12); border-radius: 10px; padding: 14px 18px; font-size: 18px; line-height: 1.45; margin-top: 14px; }
  .explain b { color: var(--accent); }

  /* leaderboard + final */
  h2.big { text-align: center; font-size: 44px; margin: 8px 0 22px; }
  .board { max-width: 760px; margin: 0 auto; width: 100%; display: grid; gap: 10px; }
  .lb { display: flex; justify-content: space-between; align-items: center; background: #fff; color: var(--ink); border-radius: 10px; padding: 14px 22px; font-size: 24px; font-weight: 900; animation: pop .3s ease-out both; }
  .lb .streak { font-size: 15px; color: #c2410c; margin-left: 10px; }
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 16px; margin: 10px 0 26px; }
  .step { width: 210px; text-align: center; }
  .step .who { font-size: 24px; font-weight: 900; margin-bottom: 8px; overflow-wrap: anywhere; }
  .step .blk { background: #fff; color: var(--ink); border-radius: 10px 10px 0 0; display: grid; place-items: center; font-size: 46px; font-weight: 900; }
  .step .pts { font-size: 18px; font-weight: 800; opacity: .9; margin-top: 6px; }
  .final-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
  .final-grid .card h3 { margin: 0 0 10px; }
  .final-grid ol { margin: 0; padding-left: 26px; font-weight: 700; line-height: 1.7; }
  .hard li span { color: var(--muted); font-weight: 600; }
  .spacer { flex: 1; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 10px; flex-wrap: wrap; }
  .hint { opacity: .7; font-size: 14px; }
  @media (max-width: 800px) { .tiles { grid-template-columns: 1fr; } .final-grid { grid-template-columns: 1fr; } .bigpin { font-size: 64px; } .lobby-head { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Accounting Review <span>Live</span></div>
    <div id="hdr-right" class="pill hidden"></div>
  </header>

  <!-- 1. Setup -->
  <section id="setup" class="card">
    <h1>Host a game</h1>
    <p id="setup-title">Project this screen. Students join on their phones.</p>
    <div class="row"><label class="lbl">Chapters</label>
      <label class="chip"><input type="checkbox" name="ch" value="7" checked> Ch. 7</label>
      <label class="chip"><input type="checkbox" name="ch" value="8" checked> Ch. 8</label>
      <label class="chip"><input type="checkbox" name="ch" value="9" checked> Ch. 9</label>
    </div>
    <div class="row"><label class="lbl" for="speed">Timer</label>
      <select id="speed">
        <option value="0.5">Fast (half time)</option>
        <option value="0.75">Quicker</option>
        <option value="1" selected>Normal</option>
        <option value="1.5">Relaxed (1.5×)</option>
        <option value="2">Extra time (2×)</option>
      </select>
    </div>
    <div class="row"><label class="lbl" for="pw">Password</label>
      <input id="pw" type="password" placeholder="Only if you set one" autocomplete="off">
    </div>
    <div class="row" style="margin-top:22px">
      <button id="create" class="btn go">Create game</button>
      <button id="resume" class="btn hidden">Resume last game</button>
    </div>
    <div id="setup-err" class="err"></div>
  </section>

  <!-- 2. Lobby -->
  <section id="lobby" class="hidden">
    <div class="lobby-head">
      <div>
        <div class="joinat">On your phone, go to <b id="join-url"></b></div>
        <div class="pinlabel">Game PIN:</div>
        <div class="bigpin" id="pin"></div>
      </div>
      <img class="qr" id="qr" alt="QR code to join">
    </div>
    <div class="lobby-bar">
      <div class="count"><span id="lobby-count">0</span> players</div>
      <div style="display:flex;gap:10px;align-items:center"><span class="hint">Click a name to remove it</span>
      <button id="start" class="btn go" disabled>Start game</button></div>
    </div>
    <div class="names" id="names"></div>
  </section>

  <!-- 3. Question / reveal -->
  <section id="question" class="hidden">
    <div class="qmeta" id="qmeta"></div>
    <div class="qgrid"><div class="qleft">
    <div class="qbox"><p class="qtext" id="qtext"></p><div id="qdata"></div></div>
    </div><div class="qright">
    <div class="mid">
      <div class="timer" id="timer">0</div>
      <div id="bars" class="bars hidden"></div>
      <div class="answered" id="answered-box"><b id="answered">0</b><span>answers</span></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div id="explain" class="explain hidden"></div>
    </div></div>
    <div class="controls">
      <button id="addtime" class="btn ghost">+30 seconds</button>
      <button id="next-q" class="btn go">End question</button>
    </div>
  </section>

  <!-- 4. Leaderboard -->
  <section id="leader" class="hidden">
    <h2 class="big">Scoreboard</h2>
    <div class="board" id="board"></div>
    <div class="spacer"></div>
    <div class="foot"><span class="hint">Space or → also advances</span><button id="next-l" class="btn go">Next question</button></div>
  </section>

  <!-- 5. Final -->
  <section id="final" class="hidden">
    <h2 class="big">Final results</h2>
    <div class="podium" id="podium"></div>
    <div class="final-grid">
      <div class="card"><h3>Top 10</h3><ol id="top10"></ol></div>
      <div class="card"><h3>Hardest questions</h3><ol class="hard" id="hard"></ol>
        <p style="margin:14px 0 0"><button id="csv" class="btn">Download results (CSV)</button></p></div>
    </div>
    <div class="foot"><span></span><button id="newgame" class="btn ghost">New game</button></div>
  </section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/host.js"></script>
</body>
</html>
