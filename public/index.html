<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1052">
<title>Join · Accounting Review Live</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100dvh; }
  .app { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
  .bar { display: flex; justify-content: space-between; align-items: center; font-weight: 800; padding: 4px 2px 12px; gap: 8px; }
  .bar .who { opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { background: rgba(255,255,255,.16); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  #join .brand { font-size: 34px; text-align: center; margin-bottom: 22px; }
  #join .card { display: grid; gap: 12px; }
  #join .btn { width: 100%; font-size: 20px; padding: 16px; }
  .msg { text-align: center; }
  .msg h1 { font-size: 30px; margin: 0 0 8px; }
  .msg p { font-size: 18px; opacity: .9; margin: 0; }
  .spinner { width: 46px; height: 46px; border: 5px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; margin: 22px auto; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tbar { height: 8px; background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
  .tbar div { height: 100%; background: var(--accent); width: 100%; transition: width .25s linear; }
  .qnum { font-weight: 800; opacity: .85; font-size: 14px; margin-bottom: 6px; display: flex; justify-content: space-between; }
  details.q { background: #fff; color: var(--ink); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  details.q summary { font-weight: 800; cursor: pointer; list-style: none; }
  details.q summary::-webkit-details-marker { display: none; }
  details.q summary::after { content: " ▾"; color: var(--muted); }
  details.q[open] summary::after { content: " ▴"; }
  details.q p { margin: 8px 0 0; font-size: 16px; line-height: 1.4; }
  details.q .tablewrap { margin-top: 10px; }
  details.q table.data { font-size: 13px; }
  .answers { display: grid; gap: 10px; }
  .answers.two { grid-template-columns: 1fr 1fr; }
  .answers .tile { font-size: 16px; min-height: 64px; width: 100%; line-height: 1.3; }
  .answers.two .tile { min-height: 120px; justify-content: center; flex-direction: column; font-size: 22px; }
  .tile.sel { outline: 4px solid #fff; outline-offset: -4px; }
  .tile .box { margin-left: auto; width: 26px; height: 26px; border: 3px solid #fff; border-radius: 6px; flex: none; display: grid; place-items: center; font-size: 18px; }
  .ms-hint { font-weight: 800; color: var(--accent); margin-bottom: 8px; }
  #submit-ms { margin-top: 12px; width: 100%; font-size: 20px; padding: 16px; }

  .result { text-align: center; border-radius: 16px; padding: 28px 18px; }
  .result.good { background: var(--ok); } .result.bad { background: var(--bad); } .result.none { background: rgba(255,255,255,.14); }
  .result h1 { font-size: 36px; margin: 0; }
  .result .pts { font-size: 26px; font-weight: 900; margin-top: 8px; }
  .result .fire { margin-top: 10px; font-weight: 800; }
  .ans { margin-top: 16px; background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px 14px; font-weight: 700; line-height: 1.4; }
  .ans b { color: var(--accent); }
  .rank { text-align: center; font-size: 22px; font-weight: 900; margin-top: 18px; }
  .big-rank { font-size: 64px; font-weight: 900; text-align: center; line-height: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="bar hidden" id="bar"><span class="who" id="who"></span><span class="score" id="score">0</span></div>

  <section id="join" class="center">
    <div class="brand">Accounting Review <span>Live</span></div>
    <form class="card" id="join-form" autocomplete="off">
      <input class="field" id="pin" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" placeholder="Game PIN" aria-label="Game PIN">
      <input class="field" id="nick" maxlength="20" placeholder="Nickname" aria-label="Nickname">
      <button class="btn" type="submit" id="join-btn">Enter</button>
      <div class="err" id="join-err"></div>
    </form>
  </section>

  <section id="wait" class="center msg hidden">
    <h1 id="wait-title">You're in!</h1>
    <p id="wait-text">See your nickname on the screen?</p>
    <div class="spinner"></div>
  </section>

  <section id="play" class="hidden">
    <div class="tbar"><div id="tfill"></div></div>
    <div class="qnum"><span id="qnum"></span><span id="tleft"></span></div>
    <details class="q" id="qd" open><summary id="qsum">Question</summary><p id="qtext"></p><div id="qdata"></div></details>
    <div class="ms-hint hidden" id="ms-hint">Select all that apply, then tap Submit.</div>
    <div class="answers" id="answers"></div>
    <button class="btn go hidden" id="submit-ms">Submit</button>
  </section>

  <section id="result" class="center hidden">
    <div class="result" id="res-box"><h1 id="res-title"></h1><div class="pts" id="res-pts"></div><div class="fire" id="res-fire"></div></div>
    <div class="ans" id="res-ans"></div>
    <div class="rank" id="res-rank"></div>
  </section>

  <section id="done" class="center msg hidden">
    <p>You finished</p>
    <div class="big-rank" id="done-rank"></div>
    <p id="done-text" style="margin-top:12px"></p>
  </section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/common.js"></script>
<script src="/play.js"></script>
</body>
</html>
